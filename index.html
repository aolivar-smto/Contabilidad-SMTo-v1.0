<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinDash SMTO | Control de Flujo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <img id="smt-logo" src="assets/SMTLogo.png" alt="SMT Logo" height="32" />
        <span class="logo-text">FinDash</span>
      </div>
      
      <div class="header-actions">
        <div id="yearFilterWrapper" class="month-filter-wrapper hidden">
          <select id="yearFilter" class="filter-select"><option value="all">Años</option></select>
        </div>
        <button class="btn btn-icon" id="themeToggle" onclick="toggleTheme()">
          <i class="ph ph-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="uploadSection" class="upload-section">
      <div class="upload-hero">
        <div class="upload-badge">Dashboard Inteligente SMTO</div>
        <h1 class="upload-title">Control de Flujo</h1>
        <p class="upload-subtitle" id="modeStatus">Modo: <strong>Formato Estándar</strong></p>
        
        <div class="mode-toggle-container">
          <button class="btn btn-mode active" id="btnStd" onclick="setAppMode('standard')">Estándar</button>
          <button class="btn btn-mode" id="btnRaw" onclick="setAppMode('raw')">Bancos (Crudo)</button>
        </div>
      </div>

      <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden onchange="handleFileChange(event)" />
        <div class="drop-zone-content">
          <div class="drop-icon">
            <i class="ph-duotone ph-cloud-arrow-up" style="font-size: 40px;"></i>
          </div>
          <p class="drop-main-text">Cargar Archivo Excel</p>
          <p class="drop-sub-text">Arrastra los reportes aquí para procesar</p>
          <div id="rawInfo" class="raw-supported-list hidden">
            <span class="drop-format-badge">BBVA · Monex · Clara · Kapital · Konfío · Xepelin</span>
          </div>
        </div>
      </div>
    </section>

    <section id="dashboardSection" class="dashboard hidden">
      <div class="dash-header">
        <div>
          <h2 class="dash-title">Resumen Financiero</h2>
          <p class="dash-subtitle" id="dashSubtitle">Análisis consolidado</p>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="location.reload()">
          <i class="ph ph-arrows-clockwise"></i> Nueva Carga
        </button>
      </div>

      <div id="dashboardContent"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
